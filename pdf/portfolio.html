<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portfólio | Manuela Aimê</title>
<!--
  GERADOR DO PDF DO PORTFÓLIO (A4 paisagem)
  Usa os mesmos dados do site (pasta dados/). Para gerar de novo depois de editar:
  abra este arquivo no Chrome/Brave > Imprimir (Ctrl+P) > Salvar como PDF,
  Layout: Paisagem, Margens: Nenhuma, marque "Gráficos de plano de fundo".
  Salve como assets/portfolio.pdf (é o arquivo que o botão "Baixar PDF" do site baixa).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=block" rel="stylesheet">
<style>
@page{size:297mm 210mm;margin:0}
:root{
  --azul:#3F68F4; --azul-texto:#2F55D9; --azul-claro:#8AA5F8;
  --escuro:#001219; --escuro-2:#0a1f28; --claro:#E9EAED; --suave-escuro:#A3AEC0;
  --texto:#3A4256; --suave:#5A6585; --linha:#DDE1EA; --fundo-2:#F3F4F7;
  --margem:16mm;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font:400 9.5pt/1.55 "Inter",system-ui,sans-serif;color:var(--texto);background:#888}
h1,h2,h3,h4{font-weight:800;text-transform:uppercase;letter-spacing:.06em;line-height:1.05;color:var(--escuro)}
a{color:inherit;text-decoration:none}
img{display:block}

.pagina{position:relative;width:297mm;height:210mm;overflow:hidden;background:#fff;page-break-after:always;break-after:page}
.pagina:last-child{page-break-after:auto;break-after:auto}
.escura{background:var(--escuro);color:var(--claro)}
.escura h1,.escura h2,.escura h3{color:var(--claro)}
@media screen{body{padding:10mm 0}.pagina{margin:0 auto 10mm;box-shadow:0 4px 24px rgba(0,0,0,.35)}}

/* Rótulos pequenos em caixa alta (como no site) */
.rotulo{font-size:7pt;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--suave)}
.escura .rotulo{color:var(--suave-escuro)}
.faixa{width:22mm;height:1.2mm;background:var(--azul)}

/* Cabeçalho e rodapé das páginas internas */
.topo-pag{position:absolute;top:9mm;left:var(--margem);right:var(--margem);display:flex;justify-content:space-between;font-size:6.5pt;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--suave)}
.escura .topo-pag,.sobre-imagem .topo-pag{color:var(--suave-escuro)}

/* ---------- CAPA ---------- */
.capa .foto{position:absolute;inset:0 auto 0 0;width:118mm;height:100%;object-fit:cover;object-position:center top;filter:grayscale(1)}
.capa .texto{position:absolute;left:136mm;right:var(--margem);top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:7mm}
.capa h1{font-size:50pt;letter-spacing:.04em}
.capa .area{font-size:11pt;font-weight:300;color:var(--claro);max-width:120mm}
.capa .rodape-capa{position:absolute;left:136mm;right:var(--margem);bottom:13mm;display:flex;gap:7mm;font-size:7.5pt;color:var(--suave-escuro);letter-spacing:.04em}

/* ---------- SOBRE ---------- */
.sobre{padding:22mm var(--margem) 14mm}
.titulo-pag{font-size:26pt;margin-bottom:8mm}
.sobre .grade{display:grid;grid-template-columns:96mm 72mm 1fr;gap:11mm}
.sobre .bio p{font-size:10pt;line-height:1.65}
.sobre .bio p+p{margin-top:3.5mm}
.sobre h3{font-size:7.5pt;letter-spacing:.25em;color:var(--azul-texto);margin-bottom:3mm}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:2mm;margin-bottom:7mm}
.tags li{padding:1.3mm 3mm;border:.3mm solid var(--azul);color:var(--escuro);font-size:6.8pt;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.formacao{list-style:none}
.formacao li{padding:1.8mm 0;border-bottom:.25mm solid var(--linha);font-size:8.6pt;line-height:1.4}
.formacao li:first-child{border-top:.25mm solid var(--linha)}
.hab h4{font-size:7pt;letter-spacing:.25em;margin:3.5mm 0 1mm}
.hab h4:first-of-type{margin-top:0}
.hab .item{display:flex;justify-content:space-between;align-items:center;padding:1.15mm 0;border-bottom:.25mm solid var(--linha);font-size:8.4pt}
.pontos{display:flex;gap:1mm}
.pontos i{width:2.4mm;height:2.4mm;border-radius:50%;background:var(--linha)}
.pontos i.on{background:var(--azul)}
.interesses{position:absolute;left:var(--margem);right:var(--margem);bottom:14mm;display:grid;grid-template-columns:auto repeat(4,1fr);gap:0;border:.25mm solid var(--linha)}
.interesses .rotulo{display:flex;align-items:center;padding:0 6mm;border-right:.25mm solid var(--linha);color:var(--azul-texto)}
.interesses div.area{padding:5mm 6mm;border-right:.25mm solid var(--linha);font-size:10.5pt;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--escuro)}
.interesses div.area:last-child{border-right:0}
.interesses div.area::before{content:"";display:block;width:8mm;height:1mm;background:var(--azul);margin-bottom:3mm}

/* ---------- PROJETO ---------- */
.projeto{display:grid;grid-template-columns:152mm 1fr}
.midia{position:relative;overflow:hidden;isolation:isolate;background:var(--escuro-2)}
.midia::before{content:"";position:absolute;inset:-10%;z-index:-1;background:var(--fundo-img) center/cover;filter:blur(14mm) brightness(.6);transform:scale(1.1)}
.midia>img{width:100%;height:100%;object-fit:contain}
.midia .selo{position:absolute;left:8mm;bottom:8mm;padding:1.2mm 3mm;background:rgba(0,0,0,.6);color:#fff;font-size:6.5pt;font-weight:600;letter-spacing:.15em;text-transform:uppercase}
.projeto .info{display:flex;flex-direction:column;padding:22mm 14mm 13mm 12mm;gap:3.6mm}
.projeto .num{font-size:7pt;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--azul-texto)}
.projeto h2{font-size:19pt;line-height:1.1}
.projeto .cat{font-size:7pt;letter-spacing:.25em;text-transform:uppercase;color:var(--suave);margin-top:-1.5mm}
.projeto h4{font-size:7pt;letter-spacing:.25em;color:var(--azul-texto);margin-bottom:1mm}
.projeto p{font-size:8.8pt;line-height:1.55}
.paleta{display:flex;gap:3mm}
.paleta div{display:flex;flex-direction:column;align-items:center;gap:1mm;font-size:5.6pt;font-weight:600;letter-spacing:.06em;color:var(--suave)}
.paleta i{width:8mm;height:8mm;border-radius:50%;border:.3mm solid var(--linha)}
.miniaturas{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm}
.miniaturas img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--fundo-2)}

/* ---------- CONTATO ---------- */
.contato{display:grid;grid-template-columns:1fr 112mm;gap:14mm;align-items:center;padding:0 var(--margem) 0 22mm}
.contato h1{font-size:40pt;margin:5mm 0 6mm}
.contato .chamada{font-size:11pt;font-weight:300;max-width:110mm;color:var(--claro)}
.cartao{border:.3mm solid var(--claro);border-radius:2mm;background:var(--escuro-2);padding:9mm}
.cartao .whats{display:flex;align-items:center;gap:3mm;padding:3.5mm 5mm;border-radius:2mm;background:var(--azul);color:#fff;font-size:8pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:2mm 0 7mm}
.cartao .whats svg{width:5mm;height:5mm;flex:none}
.cartao .whats span{margin-left:auto;letter-spacing:.04em;font-weight:500}
.canal{display:flex;justify-content:space-between;align-items:baseline;padding:2.6mm 0;border-top:.25mm solid rgba(233,234,237,.18);font-size:9pt}
.canal .rotulo{font-size:6.5pt}
.canal a{font-weight:600;color:var(--claro)}
.contato .assinatura{position:absolute;left:22mm;bottom:13mm;font-size:6.5pt;letter-spacing:.3em;text-transform:uppercase;color:var(--suave-escuro)}
</style>
</head>
<body>
<script src="../dados/perfil.js"></script>
<script src="../dados/projetos.js"></script>
<script src="../dados/habilidades.js"></script>
<script>
// Monta as páginas do PDF a partir dos dados do site
const raiz = "../";
const src = s => raiz + encodeURI(String(s).trim());
const absoluto = s => new URL(src(s), location.href).href;
const ano = new Date().getFullYear();
const preenchido = v => v != null && String(v).trim() !== "";
const nome = PERFIL.nome;
const zap = PERFIL.whatsapp.replace(/^(\d{2})(\d{2})(\d{4,5})(\d{4})$/, "+$1 $2 $3-$4");
const linkZap = `https://wa.me/${PERFIL.whatsapp}?text=${encodeURIComponent(PERFIL.mensagemWhatsapp)}`;
const semProtocolo = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
const topo = (esq, dir) => `<div class="topo-pag"><span>${esq}</span><span>${dir}</span></div>`;
const total = PROJETOS.length;
const dois = n => String(n).padStart(2, "0");
let paginas = "";

// CAPA
paginas += `<section class="pagina escura capa">
  <img class="foto" src="${src(PERFIL.foto)}" alt="">
  <div class="texto">
    <p class="rotulo">Portfólio · ${ano}</p>
    <h1>${nome.replace(" ", "<br>")}</h1>
    <div class="faixa"></div>
    <p class="area">${PERFIL.especialidade}</p>
  </div>
  <div class="rodape-capa"><span>${zap}</span><span>${PERFIL.email}</span><span>@${semProtocolo(PERFIL.links.find(l => /insta/i.test(l.nome))?.url || "").split("/").pop()}</span></div>
</section>`;

// SOBRE
paginas += `<section class="pagina sobre">
  ${topo(nome, "Sobre")}
  <h2 class="titulo-pag">Sobre mim</h2>
  <div class="grade">
    <div class="bio">${[].concat(PERFIL.bio).map(p => `<p>${p}</p>`).join("")}</div>
    <div>
      <h3>Experiências</h3><ul class="tags">${PERFIL.experiencias.map(x => `<li>${x}</li>`).join("")}</ul>
      <h3>Formação</h3><ul class="formacao">${PERFIL.formacao.map(f => `<li>${f}</li>`).join("")}</ul>
    </div>
    <div class="hab"><h3>Habilidades</h3>${HABILIDADES.map(g => `<h4>${g.grupo}</h4>` + g.itens.map(([n, v]) =>
      `<div class="item"><span>${n}</span><span class="pontos">${[1,2,3,4,5].map(x => `<i class="${x <= v ? "on" : ""}"></i>`).join("")}</span></div>`).join("")).join("")}</div>
  </div>
  <div class="interesses"><span class="rotulo">Áreas de<br>interesse</span>${PERFIL.interesses.map(i => `<div class="area">${i}</div>`).join("")}</div>
</section>`;

// PROJETOS: uma página cada (imagem principal + resumo + paleta + miniaturas)
PROJETOS.forEach((p, i) => {
  const imagens = [p.imagem, ...(p.mockups || []), ...(p.quadros || [])].filter(preenchido);
  const [principal, ...resto] = imagens;
  const cores = (p.paleta || []).map(c => String(c).trim()).filter(Boolean);
  const bloco = (t, txt) => preenchido(txt) ? `<div><h4>${t}</h4><p>${txt}</p></div>` : "";
  const fim = preenchido(p.resultado) ? ["Resultado", p.resultado] : ["Aplicação", p.aplicacao];
  paginas += `<section class="pagina projeto">
    <div class="midia sobre-imagem" ${principal ? `style="--fundo-img:url('${absoluto(principal)}')"` : ""}>
      ${principal ? `<img src="${src(principal)}" alt="">` : ""}
      ${p.video && !p.imagem ? `<span class="selo">Quadro do vídeo</span>` : ""}
    </div>
    <div class="info">
      ${topo("", `${dois(i + 1)} / ${dois(total)}`).replace('class="topo-pag"', 'class="topo-pag" style="left:164mm"')}
      <p class="num">Projeto ${dois(i + 1)}</p>
      <h2>${p.titulo}</h2>
      <p class="cat">${[p.categoria, p.ano].filter(preenchido).join(" · ")}</p>
      <div class="faixa"></div>
      ${bloco("Contexto", p.contexto)}
      ${bloco(...fim)}
      ${cores.length ? `<div><h4>Paleta</h4><div class="paleta">${cores.map(c => `<div><i style="background:${c}"></i>${c.toUpperCase()}</div>`).join("")}</div></div>` : ""}
      ${resto.length ? `<div class="miniaturas">${resto.slice(0, 3).map(s => `<img src="${src(s)}" alt="">`).join("")}</div>` : ""}
    </div>
  </section>`;
});

// CONTATO
const iconeZap = `<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>`;
paginas += `<section class="pagina escura contato">
  <div>
    <p class="rotulo">Contato</p>
    <h1>Vamos<br>conversar?</h1>
    <div class="faixa"></div>
    <p class="chamada" style="margin-top:6mm">Estou disponível para projetos, serviços e novas oportunidades.</p>
  </div>
  <div class="cartao">
    <p class="rotulo">Fale comigo</p>
    <a class="whats" href="${linkZap}">${iconeZap}WhatsApp<span>${zap}</span></a>
    <div class="canal"><span class="rotulo">E-mail</span><a href="mailto:${PERFIL.email}">${PERFIL.email}</a></div>
    ${PERFIL.links.map(l => `<div class="canal"><span class="rotulo">${l.nome}</span><a href="${l.url}">${semProtocolo(l.url)}</a></div>`).join("")}
  </div>
  <p class="assinatura">© ${ano} ${nome}</p>
</section>`;

document.body.insertAdjacentHTML("beforeend", paginas);
</script>
</body>
</html>
